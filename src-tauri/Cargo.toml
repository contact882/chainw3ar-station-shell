[package]
name = "station-shell"
version = "0.1.0"
description = "Chainw3ar encoding station shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = "2.6.3"
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = "2.11.5"
tauri-plugin-single-instance = "2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
arc-swap = "1"
async-trait = "0.1"
anyhow = "1"
pcsc = "2.9"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Pinned to tauri 2.11.5's own pins — do not float independently.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_WinRT"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[features]
default = []
